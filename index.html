<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>快讯台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <strong>快讯台</strong>
      <span>点开就能看</span>
    </div>
    <form class="search" onsubmit="return false">
      <input id="q" placeholder="搜索标题、标签、正文" />
    </form>
    <div class="top-actions">
      <button id="make" class="ghost">生成简报</button>
      <span id="live" class="live">行情待刷新</span>
    </div>
  </header>
  <div id="quotes" class="quotes"></div>
  <div class="layout">
    <nav class="nav" id="nav">
      <button data-view="news" class="on">新闻快讯</button>
      <button data-view="review">每日复盘</button>
      <button data-view="calendar">投资日历</button>
      <button data-view="filings">公告</button>
      <button data-view="research">研报草稿</button>
    </nav>
    <section class="stream">
      <div class="toolbar">
        <div id="cats" class="cats">
          <button data-cat="all" class="on">全部</button>
          <button data-cat="market">市场新闻</button>
          <button data-cat="watch">实时关注</button>
          <button data-cat="flash">快讯</button>
          <button data-cat="theme">题材资讯</button>
        </div>
        <span id="count"></span>
      </div>
      <div id="feed"></div>
    </section>
    <aside id="detail" class="detail"></aside>
  </div>
  <div id="toast"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
